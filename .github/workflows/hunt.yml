name: Project discovery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-hunt
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: state.sqlite3
          key: hunt-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hunt-state-
      - run: python -m unittest discover -s tests -v
      - run: python hunt.py --target 50
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: state.sqlite3
          key: hunt-state-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-hunt-${{ github.run_id }}
          path: reports/
          retention-days: 30
